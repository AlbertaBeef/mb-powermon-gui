<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- substrate (teal circle background) -->
  <circle cx="32" cy="32" r="30" fill="#64a19d"/>

  <!-- M-shaped circuit trace (white) -->
  <path d="M 18 48 L 18 18 L 32 38 L 46 18 L 46 48"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- vias terminating both trace ends (white pad + teal drill hole) -->
  <circle cx="18" cy="48" r="4.5" fill="#ffffff"/>
  <circle cx="18" cy="48" r="2"   fill="#64a19d"/>
  <circle cx="46" cy="48" r="4.5" fill="#ffffff"/>
  <circle cx="46" cy="48" r="2"   fill="#64a19d"/>
</svg>
